# Openbase development stack (PHASES.md Phase 0 deliverable).
# Boots: metadata Postgres + platform API + web dashboard.
# `make dev` or `docker compose up --build`.

services:
  metadata-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openbase
      POSTGRES_PASSWORD: openbase
      POSTGRES_DB: openbase
    ports:
      - "5432:5432"
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbase -d openbase"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENBASE_ADDR: ":8080"
      OPENBASE_DATABASE_URL: "postgres://openbase:openbase@metadata-db:5432/openbase?sslmode=disable"
      # Demo secret only. Set a strong value in real deployments.
      OPENBASE_JWT_SECRET: "dev-only-secret-change-me"
      # Envelope-encryption key for BYODB / provisioned connection secrets.
      OPENBASE_ENCRYPTION_KEY: "dev-only-encryption-key-change-me"
      # Dashboard origin (dev). Empty allows any origin.
      OPENBASE_ALLOWED_ORIGINS: "http://localhost:3000"
      # Origin advertised on the Connect tab. Required here: the dashboard
      # proxies /v1/* server-side, so the API only ever sees the internal
      # Host (api:8080) and would otherwise hand out an unreachable URL.
      OPENBASE_PUBLIC_URL: "http://localhost:8080"
      # "Provisioned" DB mode is off here. To enable it, the API container must
      # reach the Docker daemon: mount the socket and install the Docker CLI in
      # the image, then set OPENBASE_PROVISIONER_ENABLED: "true".
    ports:
      - "8080:8080"
    depends_on:
      metadata-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q '\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        OPENBASE_API_INTERNAL_URL: "http://api:8080"
    environment:
      NEXT_PUBLIC_OPENBASE_API_URL: ""
      OPENBASE_API_INTERNAL_URL: "http://api:8080"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  metadata-db-data: